<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная. Народный контроллер ТН</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script src="scripts.js"></script>
<script src="settings.js"></script>
<script src="chart.js"></script>
<script src="weather.js"></script>
<style>
.home-t{display:flex;justify-content:space-between;align-items:flex-end}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-size:22px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.cap{color:var(--mute);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.gvs{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
.gvs > div:last-child{display:flex;flex-direction:column;align-items:center}
.gvs .ringw{position:relative;width:140px;height:140px}
.gvs .ringw .in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gvs .ringw b{font-size:26px;letter-spacing:-1px;line-height:1.1}
.gvs .ringw span{color:var(--mute);font-size:11px}
.gvs .stepper b{font-size:30px;min-width:76px}
.gvs .btn{width:44px;height:44px;border-radius:14px}
.heat{display:flex;gap:14px;margin-top:12px;justify-content:center}
.hi{display:flex;flex-direction:column;align-items:center;gap:3px}
.hi .b{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--cell);color:#a6b0bc}
.hi .b svg{width:22px;height:22px}
.hi em{font-style:normal;font-size:11px;font-weight:800;color:#a6b0bc;letter-spacing:.3px}
.hi.on .b{background:var(--tbad);color:var(--bad);box-shadow:0 0 0 1px #f3c4c4}.hi.on em{color:var(--bad)}
.sw-row{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-weight:600;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.hp-card h3{flex-wrap:wrap}
.hp-card h3 .hp-generator{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12px}
.hp-mode{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;color:var(--mute);font-size:13px}
.hp-mode select{min-width:0}
.hp-card .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.hp-card .tile{padding:4px 8px;line-height:1.2}
.hp-card .tile b{font-size:17px}
.loops{display:grid;gap:4px;margin-top:6px}
.loop{display:grid;grid-template-columns:75px minmax(0,1fr) auto auto;align-items:baseline;gap:6px;padding:4px 8px;border-radius:8px;font-size:13px;line-height:1.35}
.loop.g{background:var(--tb)}.loop.h{background:var(--tw)}
.loop .t{font-size:11px;font-weight:800;text-transform:uppercase}
.loop.g .t{color:var(--cold)}.loop.h .t{color:var(--heat)}
.loop .values{display:flex;flex-wrap:wrap;gap:0 6px}
.loop .v{color:var(--mute);white-space:nowrap}.loop .v b{color:var(--ink);font-size:14px}
.loop .d,.loop .p{font-weight:800;white-space:nowrap}
.loop .p{color:var(--mute);font-size:12px}.loop .p.on{color:var(--ok)}
@media(max-width:420px){
	.loop{grid-template-columns:64px minmax(0,1fr) auto auto;gap:4px;padding:4px 6px;font-size:12px}
	.loop .t{font-size:10px}.loop .values{column-gap:4px}.loop .v b{font-size:13px}.loop .p{font-size:11px}
}
.hp-status{margin-top:6px}
.hp-status .tag{font-size:14px;overflow-wrap:anywhere}
.hp-card #warning{margin-top:4px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.events-card{min-width:0}
#events .ev{display:grid;grid-template-columns:8ch 16px minmax(0,1fr);align-items:center;gap:4px;line-height:18px}
#events time{width:auto;white-space:nowrap}
#events .ev-icon{width:15px;height:15px;justify-self:center;color:var(--mute)}
#events .ev-icon.ERROR{color:var(--bad)}
#events .ev-icon.WARN{color:var(--warnfg)}
#events .ev-text{grid-column:3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-empty{color:var(--mute);font-size:13px;padding:8px 0}
.lnk{font-weight:800;text-decoration:none}
.card#wx{padding-top:8px;padding-bottom:8px}#wx h3{margin-bottom:4px}
.wxbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
.wxdays{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.wxd{display:flex;flex-direction:column;align-items:center;gap:0;padding:3px 2px 4px;border-radius:12px;text-align:center}
.wxd.today{background:var(--acc2)}
.wxd b{font-size:12px;white-space:nowrap}.wxd i{font-style:normal;font-size:11px;font-weight:600;color:var(--mute)}
.wxd svg{width:22px;height:22px;margin:1px 0}.wxd svg .s{stroke:#e0a21b}.wxd svg .c{stroke:var(--mute)}.wxd svg .cf{fill:var(--card)}.wxd.today svg .cf{fill:var(--acc2)}.wxd svg .r{stroke:var(--cold)}
.wxd .mx{font-weight:800;font-size:14px;color:var(--heat)}.wxd .mn{font-weight:700;font-size:12px;color:var(--cold)}.wxd .pr{font-size:10px;color:var(--mute)}
.wxchart{min-width:0;overflow:hidden}@media (max-width:1000px){.wxbody{grid-template-columns:minmax(0,1fr)}}		/* узкое окно: график под днями во всю ширину, в половине колонки подписи накладываются */.wxchart svg{display:block}.wxchart text{font-size:10.5px;font-weight:700;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}.wxchart .tl{fill:var(--cold)}.wxchart .th{fill:var(--heat)}.wxchart .td{font-size:10px;fill:var(--mute)}
.wxchart .lh,.wxchart .ll{fill:none;stroke-width:2;stroke-linejoin:round}.wxchart .lh{stroke:var(--heat)}.wxchart .ll{stroke:var(--cold)}.wxchart .dh{fill:var(--heat)}.wxchart .dl{fill:var(--cold)}
.wxchart .neg{fill:var(--tb)}.wxchart .zero{stroke:var(--cold);stroke-width:1;stroke-dasharray:4 3}
html.m .wxbody{display:block}
html.m .wxchart{display:none}
html.m .wxdays{display:flex;overflow-x:auto;padding-bottom:4px}
html.m .wxd{flex:none;width:64px}
</style>
<script>
urlupdate = 4000;
var CH_COLORS = {tout: '#2f7fd1', tevaing: '#72b4ee', tconoutg: '#f2762e', power: '#8a6fd1', cop: '#0f8b8d', tin: '#0f8b8d'};
var chart = null, spark = null, chData = {}, chRange = 0, homeTrg = NaN, chStep = 30, chTimer = null;
var errorCode, errorText = '';
var warningCode = 0, warningText = ''; // Раздельный снимок предупреждения для согласованного показа номера и текста.


// ---- значения, пришедшие от контроллера: ответ /api/get раскладывается в прежние имена (onPageValue), логика страницы осталась как была ----
var IDX_KEYS = {'temp.TIN.value': 'get_Temp(TIN)', 'temp.TOUT.value': 'get_Temp(TOUT)', 'temp.TEVAING.value': 'get_Temp(TEVAING)', 'temp.TEVAOUTG.value': 'get_Temp(TEVAOUTG)',
	'temp.TCONING.value': 'get_Temp(TCONING)', 'temp.TCONOUTG.value': 'get_Temp(TCONOUTG)', 'temp.TBOILER.value': 'get_Temp(TBOILER)',
	'state.trg_home': 'get_TrgT(1)', 'boiler.trg': 'get_Boiler(TRG)', 'fc.cfc': 'get_pFC(cFC)', 'state.overheat': 'get_OverHeat', 'eev.pospp': 'get_pEEV(POSpp)',
	'state.power_220': 'get_Power220', 'state.power_out': 'get_PowerCO', 'state.cop': 'get_fullCOP', 'relay.RBOILER.on': 'get_Relay(RBOILER)',
	'relay.RPUMPI.on': 'get_Relay(RPUMPI)', 'relay.RPUMPO.on': 'get_Relay(RPUMPO)', 'state.errcode': 'get_errcode', 'state.error': 'get_error', 'state.warning': 'get_warning', 'state.warning_text': 'get_warning_text',
	'state.work': 'get_WORK', 'state.mode': 'get_MODE'};
function idxPoll(d) {
	for(var k in d) {
		var v = d[k];
		if(k == 'state.work') v = v ? 'ON' : 'OFF';
		if(k == 'state.trg_home') { var t = $('get_trgt-1'); if(t && v !== null) t.value = v; }
		if(k == 'boiler.trg') { var b = $('get_boiler-trg'); if(b && v !== null) b.value = v; }
		if(k == 'boiler.on' || k == 'boiler.urg' || k == 'ohp.bpow') { var c = $(k == 'boiler.on' ? 'get_boiler-on' : k == 'boiler.urg' ? 'get_boiler-urg' : 'get_ohp-bpow'); if(c && document.activeElement !== c) c.checked = v === true; continue; }
		if(k == 'state.mode_house') { modeShow(v); continue; }
		if(IDX_KEYS[k]) window.onPageValue(IDX_KEYS[k], v);
	}
}
// Список режима дома доступен в сборке с охлаждением, недоступные пункты отключены.
var modeNow = 0;
function modeShow(v) {
	var s = $('get_modehp');
	modeNow = v;
	if(s && s.options.length) s.selectedIndex = v;
}
function setKey(key, val, ok) {
	var p = {};
	p[key] = val;
	api.set(p, function(D, E, err) {
		if(err || E[key]) { stFail('Контроллер не принял значение', err ? 'net' : E[key]); api.pollTick(); }
		else if(ok) ok(D[key]);
	});
}
// ---- значения, пришедшие от контроллера (вызывается из idxPoll) ----
var ing = NaN, outg = NaN, coning = NaN, conoutg = NaN, boilerT = NaN, boilerTrg = NaN;
window.onPageValue = function(n, v) {
	switch(n) {
	case 'get_Temp(TIN)':   put('v-tin', num(v, 1)); break;
	case 'get_Temp(TOUT)':  put('v-tout', num(v, 1)); break;
	case 'get_TrgT(1)':     put('v-trg', num(v, 1)); var nt = parseFloat(v); if(nt !== homeTrg && chData.at) { homeTrg = nt; chartDraw(); } else homeTrg = nt; break;		// перерисовка только при смене цели: иначе график и его подсказка сбрасываются каждый опрос
	case 'get_Temp(TBOILER)': boilerT = parseFloat(v); drawRing(); break;
	case 'get_Boiler(TRG)': boilerTrg = parseFloat(v); put('v-btrg', btrgTxt(boilerTrg)); drawRing(); break;
	case 'get_pFC(cFC)':    put('t-fc', num(v, 0)); break;
	case 'get_OverHeat':    put('t-oh', num(v, 1)); break;
	case 'get_pEEV(POSpp)': put('t-eev', parseInt(v) >= 0 ? parseInt(v) : '–'); break;
	case 'get_Power220':    put('t-p220', num(v, 1)); break;
	case 'get_PowerCO':     put('t-pco', num(v, 1)); break;
	case 'get_fullCOP':     put('t-cop', num(v, 1)); break;
	case 'get_Temp(TEVAING)':  ing = parseFloat(v); put('c-ing', num(v, 1) + '°'); delta('c-dg', ing, outg); break;
	case 'get_Temp(TEVAOUTG)': outg = parseFloat(v); put('c-outg', num(v, 1) + '°'); delta('c-dg', ing, outg); break;
	case 'get_Temp(TCONOUTG)': conoutg = parseFloat(v); put('c-coutg', num(v, 1) + '°'); delta('c-dc', conoutg, coning); break;
	case 'get_Temp(TCONING)':  coning = parseFloat(v); put('c-coning', num(v, 1) + '°'); delta('c-dc', conoutg, coning); break;
	case 'get_Relay(RBOILER)': hot.ten = v == 1; heatIcons(); break;
	case 'get_Relay(RPUMPI)':  pump('c-pi', v); break;
	case 'get_Relay(RPUMPO)':  pump('c-po', v); break;
	case 'get_errcode':     errorCode = parseInt(v); showErr(); break;
	case 'get_error':       errorText = v; showErr(); break;
	case 'get_warning': warningCode = parseInt(v) || 0; showWarning(); break;
	case 'get_warning_text': warningText = v || ''; showWarning(); break;
	case 'get_Heat(ADT)':   night.t = parseFloat(v); showNight(); break;
	case 'get_Heat(ADH)':   night.h = parseInt(v); showNight(); break;
	case 'get_Heat(ADEH)':  night.e = parseInt(v); showNight(); break;
	case 'get_WORK':        hot.work = v == 'ON'; heatIcons(); break;
	case 'get_MODE':        hot.mode = v; heatIcons(); break;
	}
};
// Обновляет строку последнего предупреждения из кода и операторского текста; ничего не возвращает.
function showWarning() {
	var w = $('warning'), shown = warningCode && warningText;
	w.textContent = shown ? 'Последнее предупреждение: ' + warningCode + ' ' + warningText : '';
	w.hidden = !shown;
}
// чем греется бойлер: ТН - компрессор работает в режиме «ГВС», ТЭН - включено реле RBOILER (иконка есть, пока реле есть в конфигурации)
var hot = {work: false, mode: '', ten: false, hasTen: false};
function heatIcons() {
	var tn = hot.work && hot.mode == 'ГВС';
	$('hi-tn').className = 'hi' + (tn ? ' on' : '');
	$('hi-ten').className = 'hi' + (hot.ten ? ' on' : '');
	$('hi-ten').style.display = hot.hasTen ? '' : 'none';
}
function pump(id, v) { var e = $(id); if(!e) return; e.innerHTML = 'насос ' + (v == 1 ? 'вкл' : 'выкл'); e.className = 'p' + (v == 1 ? ' on' : ''); }
function delta(id, a, b) { put(id, isNaN(a) || isNaN(b) ? '' : 'Δ ' + Math.abs(a - b).toFixed(1) + '°'); }

// надбавка ночного тарифа (Отопление: «Использование ночного тарифа»)
var night = {t: 0, h: 0, e: 0};
function showNight() {
	var e = $('night');
	if(!e) return;
	e.style.display = night.t ? '' : 'none';
	e.innerHTML = (night.t > 0 ? '+' : '') + night.t + '° ночной тариф ' + ('0' + night.h).slice(-2) + ':00–' + ('0' + night.e).slice(-2) + ':00';
}

// ---- ошибки ----
function showErr() {
	var e = $('err');
	if(!e || errorCode === undefined) return;
	if(errorCode) { e.className = 'tag bad'; e.innerHTML = '⚠ ' + errorCode + ' ' + esc(errorText || 'Ошибка'); }
	else { e.className = 'tag ok'; e.innerHTML = '✓ Ошибок нет'; }
}

// Контроллер отдаёт записи от старых к новым, уже с временем публикации.
var eventRequest = false, eventHtml = '';
var eventIcons = {
	ERROR: ['Авария', '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>'],
	WARN: ['Предупреждение', '<path d="M10.3 4.9a2 2 0 0 1 3.4 0l7.4 12.8a2 2 0 0 1-1.7 3H4.6a2 2 0 0 1-1.7-3z"/><path d="M12 10v4m0 3h.01"/>'],
	EVENT: ['Событие', '<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>']
};
function showEvents(items) {
	var h = items.map(function(line) {
		var m = /^(?:\d{2}\.\d{2}\.\d{4} )?(\d{2}:\d{2}:\d{2}) (?:\$(ERROR|WARN|EVENT) )?(.+)$/.exec(line);
		if(!m) return '';
		var icon = eventIcons[m[2]];
		var svg = icon ? '<svg class="ev-icon ' + m[2] + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
			' stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="' + icon[0] + '">' + icon[1] + '</svg>' : '';
		// Сохраняем исходную строку контроллера для поиска записи в журнале.
		return '<div class="ev" title="' + esc(line) + '"><time>' + esc(m[1]) + '</time>' + svg + '<span class="ev-text">' + esc(m[3]) + '</span></div>';
	}).join('') || '<div class="ev-empty">Событий пока нет</div>';
	if(h !== eventHtml) { put('events', h); eventHtml = h; }
}
function loadEvents() {
	if(document.hidden || eventRequest) return;
	eventRequest = true;
	api.call('events', '', function(data, err) {
		eventRequest = false;
		if(data && Array.isArray(data.items)) showEvents(data.items);
		else if(!eventHtml) $('events').textContent = err && err.code === 400 ? 'Для списка событий обновите прошивку' : 'Не удалось загрузить события';
	});
}

// ---- цель дома: кнопки меняют скрытое поле get_trgt-1 и отправляют ключ state.trg_home ----
// Границ у ключа нет: цель - температура дома или обратки (разные пределы), смотря по настройке отопления. Прошивка
// за пределом цель молча не меняет, поэтому показываем значение, прочитанное после записи, и говорим, если оно не сдвинулось.
function trgStep(d) {
	var e = $('get_trgt-1'), was = parseFloat(e.value), v = Math.round((was + d) * 10) / 10;
	if(isNaN(v)) return;
	e.value = v;
	put('v-trg', v.toFixed(1));
	setKey('state.trg_home', v, function(r) {
		if(r === undefined || r === null) return;
		e.value = r;
		put('v-trg', num(r, 1));
		if(Math.abs(r - was) < 0.01) stToast('Цель не изменилась: ' + num(r, 1) + '° — граница допустимых значений.', true);
	});
}

// ---- цель ГВС: шаг 1°, скрытое поле get_boiler-trg, запись - ключ boiler.trg ----
// Границы - из meta прошивки; дробная часть цели (45,5 на «ГВС») при шаге сохраняется
function btrgTxt(v) { return isNaN(v) ? '–' : v % 1 ? num(v, 1) : String(v); }
function btrgStep(d) {
	var e = $('get_boiler-trg'), m = stKMeta('boiler.trg'), v = Math.round((parseFloat(e.value) + d) * 10) / 10;
	if(isNaN(v) || v < (m ? m.min : +e.min) || v > (m ? m.max : +e.max)) return;
	e.value = v;
	boilerTrg = v;
	put('v-btrg', btrgTxt(v));
	drawRing();
	setKey('boiler.trg', v);
}

// ---- кольцо бойлера: доля = температура / цель ----
function drawRing() {
	var size = 140, st = 12, r = (size - st) / 2, c = 2 * Math.PI * r, m = size / 2;
	var f = isNaN(boilerT) || !(boilerTrg > 0) ? 0 : Math.max(0, Math.min(1, boilerT / boilerTrg));
	put('ring', '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '"><circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" style="stroke:var(--cell)" stroke-width="' + st +
		'"/><circle cx="' + m + '" cy="' + m + '" r="' + r + '" fill="none" style="stroke:var(--cold)" stroke-width="' + st + '" stroke-linecap="round" stroke-dasharray="' + (c * f) + ' ' + c + '" transform="rotate(-90 ' + m + ' ' + m + ')"/></svg>');
	put('v-bt', num(boilerT, 1) + '°');
}

// ---- график: подача/обратка/геоконтур + частота, мини-график дома ----
var SERIES = [
	['tout', 'Улица', /улицы/],
	['tevaing', 'Из геоконтура', /входе испарителя по гликолю/],
	['tconoutg', 'Подача', /выходе конденсатора по гликолю/],
	['power', 'Мощность', /Потребляемая мощность/],
	['cop', 'COP', /Full COP/],
	['tin', 'Дом', /в доме/]
];
var chOn = {tout: 1}, chIdx = {};
function chartInit() {
	api.get({k: ['chart.list', 'ohp.time_chart']}, function(D) {
		var names = chartNamesApi(D['chart.list']), chips = '';
		SERIES.forEach(function(s) {
			chIdx[s[0]] = chartFind(names, s[2]);
			if(s[0] != 'tin' && chIdx[s[0]]) chips += '<span class="chip' + (chOn[s[0]] ? ' on' : '') + '" data-k="' + s[0] + '" style="--c:' + CH_COLORS[s[0]] + '" onclick="chToggle(this)"><i></i>' + s[1] + '</span>';
		});
		put('ch-series', chips);
		chStep = parseInt(D['ohp.time_chart']) || 30;
		chartRefresh();
	});
}
function chartRefresh() {
	var pending = 0;
	SERIES.forEach(function(s) {
		if(!chIdx[s[0]]) return;
		pending++;
		chartLoad(chIdx[s[0]], function(d) {
			chData[s[0]] = d;
			if(--pending == 0) { chData.at = Date.now(); chartDraw(); }
		});
	});
	clearTimeout(chTimer);
	chTimer = setTimeout(chartRefresh, 60000);
}
function chartDraw() {
	var cnt = chRange ? Math.ceil(chRange * 60 / chStep) : 1000, lanes = [], temps = [], pw = [], cop = [];
	SERIES.forEach(function(s) {
		var k = s[0];
		if(k == 'tin' || !chOn[k] || !chData[k]) return;
		(k == 'power' ? pw : k == 'cop' ? cop : temps).push({name: s[1], color: CH_COLORS[k], data: chData[k].slice(-cnt), area: k == 'tconoutg', w: 2});
	});
	var n = (temps.length ? 1 : 0) + (pw.length ? 1 : 0) + (cop.length ? 1 : 0);
	if(temps.length) lanes.push({h: n > 1 ? 170 : 260, unit: '°C', series: temps});
	if(pw.length) lanes.push({h: n > 1 ? 70 : 260, unit: 'кВт', min: 0, minSpan: 1, series: pw});
	if(cop.length) lanes.push({h: n > 1 ? 70 : 260, min: 0, minSpan: 1, title: 'COP', series: cop});
	if(!chart) chart = new SvgChart($('ch'), {});
	chart.o = {lanes: lanes, step: chStep, end: chData.at};
	chart.draw();
	if(chData.tin && chData.tin.length > 1) {
		if(!spark) spark = new SvgChart($('spark'), {});
		spark.o = {lanes: [{h: 100, series: [{name: 'Дом', color: CH_COLORS.tin, data: chData.tin, area: true, w: 1.8}], ref: isNaN(homeTrg) ? null : {v: homeTrg, color: getComputedStyle(document.documentElement).getPropertyValue('--cold').trim() || '#2f7fd1', label: 'цель ' + homeTrg.toFixed(1) + '°'}}], step: chStep, end: chData.at, pad: {l: 34, r: 6, t: 6, b: 4}, noTime: true};
		spark.draw();
		var sec = chData.tin.length * chStep;
		put('spark-cap', 'последние ' + (sec >= 5400 ? Math.round(sec / 360) / 10 + ' ч' : Math.round(sec / 60) + ' мин'));
	}
}
function chToggle(e) {
	var k = e.getAttribute('data-k');
	chOn[k] = !chOn[k];
	e.className = 'chip' + (chOn[k] ? ' on' : '');
	chartDraw();
}
function chSetRange(e, m) {
	chRange = m;
	var c = e.parentNode.children;
	for(var i = 0; i < c.length; i++) c[i].className = 'chip' + (c[i] == e ? ' on' : '');
	chartDraw();
}

window.onload = function() {
	api.init(function(v) {
		var caps = (v && v.caps) || {};
		if(!caps.cool) document.body.classList.add('onlyheat');
		$('events-log').hidden = !v || v.role !== 'admin';
		if(caps.cool) api.metaOf('state', function(m) {
			var s = $('get_modehp'), o = m && m.m && m.m['state.mode_house'];
			if(s && o) {
				s.innerHTML = o.o.map(function(t, i) { return '<option' + ((o.na || []).indexOf(i) >= 0 ? ' disabled' : '') + '>' + stEsc(t) + '</option>'; }).join('');
				s.selectedIndex = modeNow;
			}
		});
		api.metaOf('boiler', function() {});		// границы цели ГВС для кнопок (btrgStep)
		api.get({k: ['heat.adt', 'heat.adh', 'heat.adeh']}, function(D) {
			night.t = D['heat.adt']; night.h = D['heat.adh']; night.e = D['heat.adeh']; showNight();
		});
		api.get({k: ['relay.RBOILER.present']}, function(D) { hot.hasTen = D['relay.RBOILER.present'] === true; heatIcons(); });
		var keys = Object.keys(IDX_KEYS).concat(['boiler.on', 'boiler.urg', 'ohp.bpow']);
		if(caps.cool) keys.push('state.mode_house');
		api.poll({k: keys}, idxPoll);
		loadEvents();
		setInterval(loadEvents, 12000);
		document.addEventListener('visibilitychange', loadEvents);
	});
	chartInit();
	wxRender($('wx'));
	setInterval(function() { wxRender($('wx')); }, 30 * 60 * 1000);
};
</script>
</head>
<body class="index">
<div id="menu" class="menu"><script src="menu.js"></script></div>
<div class="content">
<div class="grid">

	<section class="card c4">
		<h3>Дом <span class="r" style="color:var(--mute)" id="spark-cap"></span></h3>
		<div class="home-t">
			<div class="big"><span id="v-tin">–</span><small>°C</small></div>
			<div style="text-align:center">
				<div class="cap" style="margin-bottom:6px">Цель</div>
				<div class="stepper">
					<button class="btn" onclick="trgStep(-0.5)" title="Цель ниже на 0,5°"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
					<b><span id="v-trg">–</span>°</b>
					<button class="btn p" onclick="trgStep(0.5)" title="Цель выше на 0,5°"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
				</div>
				<input id="get_trgt-1" type="number" step="0.1" hidden>
			</div>
		</div>
		<div class="row" style="justify-content:space-between;margin:8px 0 6px"><span style="color:var(--mute)">На улице <b style="color:var(--ink)"><span id="v-tout">–</span>°</b></span><span class="tag w" id="night" style="display:none"></span></div>
		<div id="spark"></div>
	</section>

	<section class="card c4">
		<h3>Бойлер ГВС <span class="r">Нагрев</span><input type="checkbox" class="sw sm" id="get_boiler-on" onchange="setKey('boiler.on', this.checked ? 1 : 0)"></h3>
		<div class="gvs"><div class="ringw"><div id="ring"></div><div class="in"><b id="v-bt">–</b><span>сейчас</span></div></div>
			<div><div class="cap" style="margin-bottom:6px">Цель</div>
				<div class="stepper">
					<button class="btn" onclick="btrgStep(-1)" title="Цель ниже на 1°"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
					<b><span id="v-btrg">–</span>°</b>
					<button class="btn p" onclick="btrgStep(1)" title="Цель выше на 1°"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
				</div>
				<input id="get_boiler-trg" type="number" min="5" max="95" step="0.1" hidden>
				<div class="heat"><div class="hi" id="hi-tn" title="Нагрев бойлера тепловым насосом"><span class="b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.6"/><path d="M12 8.4v7.2M8.4 12h7.2"/></svg></span><em>ТН</em></div><div class="hi" id="hi-ten" style="display:none" title="Нагрев бойлера ТЭНом"><span class="b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2-6 3 12 3-12 2 6h5"/></svg></span><em>ТЭН</em></div></div>
			</div></div>
		<div class="sw-row"><span>Срочный нагрев</span><input type="checkbox" class="sw sm" id="get_boiler-urg" onchange="setKey('boiler.urg', this.checked ? 1 : 0)"></div>
	</section>

	<section class="card c4 hp-card">
		<h3>Тепловой насос <span class="hp-generator r"><label for="get_ohp-bpow">Работа от генератора</label><span class="hint" data-tip="Работа ТН от резервного источника питания: ограничение потребляемой мощности, электрокотёл, ТЭН бойлера и реле по суткам выключены. Флаг не хранится в EEPROM и сбрасывается при сбросе контроллера.">i</span><input type="checkbox" class="sw sm" id="get_ohp-bpow" onchange="setKey('ohp.bpow', this.checked ? 1 : 0)"></span></h3>
		<div class="hp-mode cool"><label for="get_modehp">Режим работы</label>
			<select id="get_modehp" onchange="setKey('state.mode_house', this.selectedIndex)"></select>
		</div>
		<div class="tiles">
			<div class="tile"><i>Компрессор</i><b id="t-fc">–</b><u>Гц</u></div>
			<div class="tile"><i>Перегрев</i><b id="t-oh">–</b><u>K</u></div>
			<div class="tile"><i>ЭРВ</i><b id="t-eev">–</b><u>шаг</u></div>
			<div class="tile"><i>Потребл.</i><b id="t-p220">–</b><u>кВт</u></div>
			<div class="tile"><i>Тепло</i><b id="t-pco">–</b><u>кВт</u></div>
			<div class="tile acc"><i>COP</i><b id="t-cop">–</b></div>
		</div>
		<div class="loops" role="group" aria-label="Контуры">
			<div class="loop g"><span class="t">Геоконтур</span><span class="values"><span class="v">из <b id="c-ing">–</b></span><span class="v">в <b id="c-outg">–</b></span></span><span class="d" id="c-dg"></span><span class="p" id="c-pi"></span></div>
			<div class="loop h"><span class="t">Отопление</span><span class="values"><span class="v">под. <b id="c-coutg">–</b></span><span class="v">обр. <b id="c-coning">–</b></span></span><span class="d" id="c-dc"></span><span class="p" id="c-po"></span></div>
		</div>
		<div class="row hp-status"><span class="tag ok" id="err">…</span></div>
		<div id="warning" hidden></div>
	</section>

	<section class="card c8">
		<h3>График <span class="r chips" style="margin-left:auto"><span class="chip" onclick="chSetRange(this,30)">30 мин</span><span class="chip" onclick="chSetRange(this,60)">1 ч</span><span class="chip" onclick="chSetRange(this,180)">3 ч</span><span class="chip on" onclick="chSetRange(this,0)">весь буфер</span></span></h3>
		<div class="chips" id="ch-series" style="margin-bottom:6px"></div>
		<div id="ch" style="min-height:120px"></div>
		<div class="row" style="justify-content:flex-end;margin-top:4px"><a href="charts.html" class="lnk">Все графики →</a></div>
	</section>

	<section class="card c4 events-card">
		<h3>События <a href="log.html" class="r lnk" id="events-log" hidden>Журнал →</a></h3>
		<div id="events"><div class="ev-empty">Загрузка событий…</div></div>
	</section>

	<section class="card c12" id="wx" hidden></section>

</div>
</div>
</body>
</html>
