<!DOCTYPE html>
<html lang="ru">
<head>
	<title>Журнал. Народный контроллер ТН</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="style.css">
	<script type='text/javascript' src='scripts.js'></script>
	<script type="text/javascript">
		// Читает страницы справочника и выводит строки с номерами и способом регистрации.
		window.onload = function() {
			var table = document.getElementById('get_syserr');
			// Добавляет строку, вставляя значения через textContent.
			function row(values) {
				var tr = table.insertRow();
				values.forEach(function(value) { tr.insertCell().textContent = value; });
			}
			// Загружает страницу с offset и продолжает до total.
			function loadPart(offset) {
				api.call('errors', 'offset=' + offset + '&limit=24', function(data, err) {
					if(err || !data || !data.items) row(['Страница справочника недоступна']);
					else data.items.forEach(function(item) {
						row([item.code, item.group, item.registration, item.description]);
					});
					if(data && offset + data.count < data.total) loadPart(offset + data.count);
				});
			}
			loadPart(0);
		};
	</script>
</head>
<body class="help log">
<div id="menu" class="menu"><script src="menu.js"></script></div>
<div class="content">
<h1>Ошибки <input style="float:none;" type="submit" value="Назад" onclick="location.href='log.html'"></h1>
<div class="row1">
<table style="font-size: small">
	<thead><tr><th width="10">Номер</th><th>Группа</th><th>Регистрация</th><th>Описание</th></tr></thead>
	<tbody id="get_syserr">
	</tbody>
</table>
</div>
</div>
</body>
</html>
