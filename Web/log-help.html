<!DOCTYPE html>
<html lang="ru">
<head>
	<title>Журнал. Народный контроллер ТН</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="style.css">
	<script type='text/javascript' src='scripts.js'></script>
	<script type="text/javascript">
		// Справочник кодов ошибок: ключи sys.errors и sys.errors1 (массивы строк, индекс = -код), по одному запросу
		window.onload = function() {
			var list = [], rows = '';
			function show() {
				list.forEach(function(t, i) { rows += '<tr><td>' + (i ? -i : 0) + '</td><td>' + String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</td></tr>'; });
				document.getElementById('get_syserr').innerHTML = rows;
			}
			api.get({k: ['sys.errors']}, function(D, E, err) {
				if(err || !D['sys.errors']) { document.getElementById('get_syserr').innerHTML = '<tr><td colspan="2">Нет связи с контроллером</td></tr>'; return; }
				list = D['sys.errors'];
				api.get({k: ['sys.errors1']}, function(D2) { list = list.concat(D2['sys.errors1'] || []); show(); });
			});
		};
	</script>
</head>
<body class="help log">
<div id="menu" class="menu"><script src="menu.js"></script></div>
<div class="content">
<h1>Ошибки <input style="float:none;" type="submit" value="Назад" onclick="location.href='log.html'"></h1>
<div class="row1">
<table style="font-size: small">
	<thead><tr><th width="10">Номер</th><th>Описание</th></tr></thead>
	<tbody id="get_syserr">
	</tbody>
</table>
</div>
</div>
</body>
</html>
